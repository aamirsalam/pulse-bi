name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes pulse_bi tests tools
      - run: pytest -q
      - run: python -m pulse_bi check && python -m pulse_bi publish --no-deploy && python -m pulse_bi alerts --dry-run

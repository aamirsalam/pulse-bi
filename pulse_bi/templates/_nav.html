{# Period picker: links to the saved page for each period. #}
<nav class="period-nav" aria-label="Period">
    {% for key, prefix, label in [('7d', 'Last ', '7 days'), ('30d', 'Last ', '30 days'), ('month', '', 'This month'), ('all', '', 'All time')] %}
    <a href="{{ (('index' if key == 'all' else key) ~ '.html') if static_site else url_for('dashboard', period=key) }}"
        class="period-link {% if top_products_period == key %}active{% endif %}"
        {% if top_products_period == key %}aria-current="page"{% endif %}><span>{% if prefix %}<span class="period-prefix">{{ prefix }}</span>{% endif %}{{ label }}</span></a>
    {% endfor %}
</nav>
